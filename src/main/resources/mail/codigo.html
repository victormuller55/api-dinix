<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Dinix</title>
</head>
<body style="margin:0;padding:0;background-color:#121212;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
  <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;font-size:1px;line-height:1px;color:#121212;opacity:0;">
    {{PREHEADER}}
  </div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#121212;margin:0;padding:0;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:560px;background-color:#1C1C1C;border-radius:16px;overflow:hidden;">
          <tr>
            <td align="center" style="background-color:#000000;padding:36px 24px 32px;border-bottom:3px solid #FF9800;">
              <img src="{{LOGO_SRC}}" alt="Dinix" width="176" height="61" style="display:block;width:176px;height:auto;border:0;outline:none;text-decoration:none;">
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:40px 32px 8px;font-family:Arial,Helvetica,sans-serif;">
              <p style="margin:0 0 12px;color:#FF9800;font-size:11px;font-weight:700;letter-spacing:2.4px;text-transform:uppercase;">
                {{BADGE}}
              </p>
              <p style="margin:0 0 28px;color:#F5F5F5;font-size:16px;line-height:24px;">
                {{INTRO}}
              </p>
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center">
                <tr>
                  <td align="center" style="background-color:#000000;border:1px solid #FF9800;border-radius:12px;padding:18px 32px;">
                    <span style="font-family:Consolas,'Courier New',monospace;font-size:32px;font-weight:700;letter-spacing:10px;color:#FFFFFF;line-height:1;">{{CODE}}</span>
                  </td>
                </tr>
              </table>
              <p style="margin:28px 0 0;color:#BDBDBD;font-size:14px;line-height:22px;font-family:Arial,Helvetica,sans-serif;">
                Este código expira em <strong style="color:#F5F5F5;">{{EXPIRATION_HOURS}} horas</strong>.
              </p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:28px 32px 36px;font-family:Arial,Helvetica,sans-serif;border-top:1px solid #2A2A2A;">
              <p style="margin:0;color:#8A8A8A;font-size:12px;line-height:20px;">
                Se você não solicitou este código, ignore este e-mail.<br>
                © 2026 Dinix
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
