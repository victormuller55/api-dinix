spring:
  application:
    name: dinix
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: ${APP_TIMEZONE:America/Sao_Paulo}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: ${APP_TIMEZONE:America/Sao_Paulo}
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST:smtp.hostinger.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:noreply@convertix.net.br}
    password: ${MAIL_PASSWORD:Nick09812&D}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false
            required: false

server:
  port: ${SERVER_PORT:8080}

app:
  timezone: ${APP_TIMEZONE:America/Sao_Paulo}
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-256-bit-secret-key-for-hs256!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  mail:
    from: ${MAIL_FROM:noreply@convertix.net.br}
  email-verification:
    code-expiration-hours: ${EMAIL_CODE_EXPIRATION_HOURS:3}
    resend-interval-minutes: ${EMAIL_RESEND_INTERVAL_MINUTES:5}
  storage:
    path: ${APP_STORAGE_PATH:./data/uploads}
    max-bytes: ${APP_STORAGE_MAX_BYTES:5242880}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    persist-authorization: true
    display-request-duration: true
  api-docs:
    path: /v3/api-docs
  show-actuator: false
