app:
  jwt:
    secret: test-secret-key-must-be-at-least-256-bits-long-for-hs256
    expiration-ms: 3600000
  mail:
    from: noreply@test.local
  email-verification:
    code-expiration-hours: 3
    resend-interval-minutes: 0
  storage:
    path: ./target/test-uploads
    max-bytes: 5242880

spring:
  datasource:
    url: jdbc:h2:mem:dinix;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        globally_quoted_identifiers: true
  flyway:
    enabled: false
